\
# Lab 2 + Lab 3: test, build, smoke-test and scan.
# Local deployment is handled separately with Docker Compose (Lab 3 Option B).
name: ci

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Train
        run: python -m src.train.train

      - name: Test
        run: pytest -q tests

  build:
    name: build, smoke test and scan
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the local image
        run: echo "IMAGE=churn-api:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fs localhost:8000/health | tee health.json

          curl -fs -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @sample_request.json

          grep -q "${GITHUB_SHA::7}" health.json

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report successful local image build
        run: |
          {
            echo "### Docker image built and scanned"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Health | Passed |"
            echo "| Smoke test | Passed |"
            echo "| Trivy | Passed |"
            echo "| Deployment | Local Docker Compose (Option B) |"
          } >> "$GITHUB_STEP_SUMMARY"
